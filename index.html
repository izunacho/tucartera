// backend propio (ej. un Worker de Cloudflare) como fuente principal.
const CORS_PROXIES = ['https://corsproxy.io/?', 'https://api.allorigins.win/raw?url='];

// Debounce hook
const useDebounce = (value, delay = 400) => {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const t = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(t);
  }, [value, delay]);
  return debounced;
};

// ===== APIs =====
// Intenta pedir targetUrl a través de cada proxy de CORS_PROXIES en orden,
// con un timeout corto por intento. Devuelve la primera respuesta OK, o
// null si todos los proxies fallan.
const fetchWithProxyFallback = async (targetUrl, timeoutMs = 6000) => {
  for (const proxy of CORS_PROXIES) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(proxy + encodeURIComponent(targetUrl), { signal: controller.signal });
      if (res.ok) return res;
    } catch (e) {
      // probar el siguiente proxy
    } finally {
      clearTimeout(timer);
    }
  }
  return null;
};

// Búsqueda en CoinGecko (universo cripto completo, ~17k monedas)
const searchCryptos = async query => {
  try {
    const res = await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(query)}`);
    if (!res.ok) return [];
    const data = await res.json();
    return (data.coins || []).slice(0, 15).map(c => ({
      id: `crypto:${c.id}`,
      source: 'coingecko',
      sourceId: c.id,
      symbol: (c.symbol || '').toUpperCase(),
      name: c.name,
      type: 'crypto',
      thumb: c.thumb,
      marketCapRank: c.market_cap_rank
    }));
  } catch (e) {
    return [];
  }
};

// Búsqueda en Yahoo Finance (acciones, ETFs, índices, commodities, FX, etc.)
const searchYahoo = async query => {
  try {
    const url = `https://query2.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(query)}&quotesCount=12&newsCount=0`;
    const res = await fetchWithProxyFallback(url);
    if (!res) return [];
    const data = await res.json();
    return (data.quotes || []).filter(q => q.symbol && q.quoteType !== 'CRYPTOCURRENCY') // las cripto ya van por CoinGecko
    .map(q => ({
      id: `yahoo:${q.symbol}`,
      source: 'yahoo',
      sourceId: q.symbol,
      symbol: q.symbol,
      name: q.shortname || q.longname || q.symbol,
      type: (q.quoteType || 'stock').toLowerCase(),
      exchange: q.exchDisp || q.exchange
    }));
  } catch (e) {
    return [];
  }
};

// Precio cripto puntual desde CoinGecko
const getCryptoPrices = async ids => {
  if (!ids.length) return {};
  try {
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=usd&include_24hr_change=true`);
    if (!res.ok) return {};
    return await res.json();
  } catch (e) {
    return {};
  }
};

// Precio acción desde Yahoo Finance
const getYahooQuotes = async symbols => {
  if (!symbols.length) return {};
  try {
    const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbols.join(',')}`;
    const res = await fetchWithProxyFallback(url);
    if (!res) return {};
    const data = await res.json();
    const out = {};
    (data.quoteResponse?.result || []).forEach(q => {
      out[q.symbol] = {
        usd: q.regularMarketPrice,
        usd_24h_change: q.regularMarketChangePercent,
        currency: q.currency
      };
    });
    return out;
  } catch (e) {
    return {};
  }
};

// Histórico cripto
const getCryptoHistory = async (cgId, days) => {
  try {
    const res = await fetch(`https://api.coingecko.com/api/v3/coins/${cgId}/market_chart?vs_currency=usd&days=${days}`);
    if (!res.ok) return null;
    const data = await res.json();
    return data.prices; // [[ts, price], ...]
  } catch (e) {
    return null;
  }
};

// Histórico Yahoo: usa endpoint chart
const getYahooHistory = async (symbol, days) => {
  try {
    const range = days === '1' ? '1d' : days === '7' ? '5d' : days === '30' ? '1mo' : days === '90' ? '3mo' : '1y';
    const interval = days === '1' ? '15m' : days === '7' ? '1h' : '1d';
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=${range}&interval=${interval}`;
    const res = await fetchWithProxyFallback(url);
    if (!res) return null;
    const data = await res.json();
    const result = data.chart?.result?.[0];
    if (!result) return null;
    const timestamps = result.timestamp || [];
    const closes = result.indicators?.quote?.[0]?.close || [];
    return timestamps.map((t, i) => [t * 1000, closes[i]]).filter(p => p[1] != null);
  } catch (e) {
    return null;
  }
};

// Carga la caché de precios guardada localmente (para no arrancar en blanco).
const loadPriceCache = () => {
  try {
    const raw = localStorage.getItem(PRICE_CACHE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch {
    return {};
  }
};
const savePriceCache = cache => {
  try {
    localStorage.setItem(PRICE_CACHE_KEY, JSON.stringify(cache));
  } catch {}
};

// Carga/guarda las alertas de precio del usuario.
const loadAlerts = () => {
  try {
    const raw = localStorage.getItem(ALERTS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
};
const saveAlerts = alerts => {
  try {
    localStorage.setItem(ALERTS_KEY, JSON.stringify(alerts));
  } catch {}
};

// Muestra una notificación del navegador para una alerta disparada. Usa
// ServiceWorkerRegistration.showNotification() (no `new Notification()`)
// porque Safari en Mac/iOS solo soporta notificaciones vía Service Worker;
// sw.js ya está registrado, así que este único camino funciona en todos
// los navegadores soportados. Si no hay permiso o la API no existe, no
// hace nada — el banner in-app sigue funcionando igual.
const sendBrowserNotification = async (alert, prices) => {
  if (typeof Notification === 'undefined' || !('serviceWorker' in navigator)) return;
  if (Notification.permission !== 'granted') return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const priceNow = prices[`${alert.source}:${alert.sourceId}`]?.usd;
    await reg.showNotification(
      `${alert.symbol} ${alert.direction === 'above' ? 'super\xF3' : 'cay\xF3 bajo'} $${formatNumber(alert.threshold, 2)}`,
      {
        body: priceNow != null ? `Precio actual: ${formatCurrency(priceNow)}` : undefined,
        icon: 'icon-192.png',
        badge: 'icon-192.png',
        tag: `cartera-alert-${alert.id}`
      }
    );
  } catch (e) {
    console.error('No se pudo mostrar la notificaci\xF3n push:', e);
  }
};

// Migra holdings de v2 (amount/buyPrice planos) a v3 (transactions[]), una
// sola vez, de forma idempotente. v2 nunca se borra ni se vuelve a escribir:
// queda como backup de solo lectura para siempre.
const migrateHoldingsIfNeeded = () => {
  try {
